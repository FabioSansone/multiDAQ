[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multidaq"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "pyzmq",
    "cmd2",
    "rich",
    "smbus2",
    # hvmodbus.py uses FramerType, convert_from_registers and the device_id argument;
    # the [serial] extra installs pyserial, which the Modbus serial client needs.
    "pymodbus[serial]>=3.10,<4",
    "prometheus_client",
    # The server starts the web control panel (flask) unless it is run with --no-web.
    "flask",
    # Optical instruments (Thorlabs filter wheels and polarizer) of the calibration.
    "pylablib",
]

[tool.setuptools.dynamic]
version = {attr = "common.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "client*", "common*"]

# The code finds these files next to the Python modules (Path(__file__)), so they
# must be installed with the package: the C sources of the receiver, the detector
# JSON files and the web page.
[tool.setuptools.package-data]
server = [
    "acquisition/*.c",
    "acquisition/dispatch/*.c",
    "acquisition/dispatch/*.h",
    "multipmt_config_files/*.json",
    "web/templates/*",
    "web/static/*",
]

[project.scripts]
multidaq-server = "server.main:main"
multidaq-client = "client.main:main"
